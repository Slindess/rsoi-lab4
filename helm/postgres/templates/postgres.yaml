apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  10-databases.sql: |
    CREATE DATABASE reservations;
    CREATE DATABASE payments;
    CREATE DATABASE loyalties;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ required "nodeName is required for local persistence" .Values.nodeName | quote }}
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: program
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-database
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U program -d postgres -h 127.0.0.1']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U program -d postgres -h 127.0.0.1']
            periodSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U program -d postgres -h 127.0.0.1']
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.hostPath | quote }}
            type: DirectoryOrCreate
        - name: init
          configMap:
            name: postgres-init
